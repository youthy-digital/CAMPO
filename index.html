<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAMPO · Gestión de incidencias</title>
<meta name="description" content="CAMPO · gestión de incidencias en campo para Aguas del Este: la cuadrilla y Operaciones trabajando sobre el mismo caso, con o sin conexión.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.8s-6.4 7-6.4 11.8a6.4 6.4 0 0 0 12.8 0C18.4 9.8 12 2.8 12 2.8z' fill='%231f5fae'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue-800:#173f73;--blue-700:#1b4f91;--blue-600:#1f5fae;--blue-500:#2f74c8;--blue-200:#c4d8f1;--blue-100:#e3edf9;--blue-50:#f2f7fd;
  --navy:#10243f;--navy-2:#18345a;
  --g900:#18212d;--g700:#3a4859;--g600:#4f5e71;--g500:#66768a;--g400:#8d99a8;--g300:#c3ccd7;--g200:#dde3ea;--g150:#e7ecf1;--g100:#eef2f6;--g50:#f6f8fb;
  --green:#1b7f50;--green-bg:#e2f3ea;--amber:#a45208;--amber-bg:#fdf0d5;--amber-line:#f4c56b;--red:#bf3434;--red-bg:#fbe7e7;--indigo:#4351b5;--indigo-bg:#eaedfb;
  --radius:12px;--shadow:0 1px 2px rgba(16,36,63,.06),0 4px 16px rgba(16,36,63,.06);
  font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#e9eef4;color:var(--g900);-webkit-font-smoothing:antialiased}
body{font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.no-anim *,.no-anim *::before,.no-anim *::after{transition:none!important;animation:none!important}

/* ------- Barra de demostración ------- */
.demobar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 16px;background:var(--navy);color:#dbe6f3;font-size:13px}
.demobar .brand{display:flex;align-items:center;gap:8px;font-weight:700;color:#fff;font-size:15px;letter-spacing:.02em}
.demobar .brand small{font-weight:600;color:#9fb6d3;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid #35557f;border-radius:5px;padding:1px 6px}
.demobar .grp{display:flex;align-items:center;gap:8px}
.demobar .lbl{color:#9fb6d3;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.seg{display:inline-flex;background:#0b1a2f;border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:#b7c8dd;padding:6px 11px;border-radius:7px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.seg button.on{background:#fff;color:var(--navy)}
.conn-toggle{display:flex;align-items:center;gap:8px;border:1px solid #35557f;background:#0b1a2f;border-radius:9px;padding:5px 10px 5px 6px;color:#fff;font-weight:600}
.conn-toggle .sw{width:34px;height:20px;border-radius:10px;background:#2e9d68;position:relative;transition:background .2s}
.conn-toggle .sw::after{content:"";position:absolute;top:2px;left:16px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.conn-toggle.off .sw{background:#d0782a}.conn-toggle.off .sw::after{left:2px}
.dbtn{border:1px solid #35557f;background:transparent;color:#dbe6f3;border-radius:8px;padding:6px 10px;font-weight:600;display:flex;align-items:center;gap:6px;font-size:13px}
.dbtn:hover{background:#18345a}
.demobar .spacer{flex:1}
@media (max-width:1560px){.demobar .sim-note{display:none}}
@media (max-width:1380px){.demobar .lbl{display:none}}
.sim-note{color:#9fb6d3;font-size:12px}

/* ------- Escenario ------- */
.stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:22px 18px 40px;min-height:calc(100vh - 52px)}
.stage.split{justify-content:stretch}
.pane-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--g600);margin:0 0 8px 4px}
.pane-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blue-600)}
.pane-label.ops .dot{background:var(--navy)}
.col-m{flex:none;width:400px}
.col-d{flex:1;min-width:0;max-width:1320px}
.stage:not(.split) .col-d{max-width:1360px}
.phone{width:400px;height:min(860px,calc(100vh - 110px));min-height:640px;border-radius:38px;background:#0d1724;padding:11px;box-shadow:0 20px 50px rgba(16,36,63,.25)}
.phone .screen{position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;background:var(--g50)}
.deskframe{border-radius:14px;overflow:hidden;box-shadow:0 14px 40px rgba(16,36,63,.18);background:#fff;height:min(900px,calc(100vh - 110px));min-height:640px}

/* ------- App móvil (Cuadrilla) ------- */
.mapp{display:flex;flex-direction:column;height:100%;background:var(--g50)}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:9px 22px 5px;font-size:13px;font-weight:600;color:var(--g900);background:#fff}
.statusbar .r{display:flex;gap:6px;align-items:center}
.statusbar .batt{width:22px;height:11px;border:1.5px solid var(--g700);border-radius:3px;position:relative}
.statusbar .batt::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:var(--g700);border-radius:1px}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px;background:#fff;border-bottom:1px solid var(--g200)}
.mhead .t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:var(--blue-700);letter-spacing:.04em}
.mhead .back{border:0;background:var(--g100);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--g700)}
.mhead .ttl{font-weight:700;font-size:16px;color:var(--g900)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px 4px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.on{background:var(--green-bg);color:var(--green)}
.pill.off{background:var(--amber-bg);color:var(--amber)}
.pill.pend{background:var(--amber-bg);color:var(--amber)}
.pill.ok{background:var(--green-bg);color:var(--green)}
.pill.blue{background:var(--blue-100);color:var(--blue-700)}
.pill.gray{background:var(--g100);color:var(--g600)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.ia{background:var(--indigo-bg);color:var(--indigo)}
.offline-banner{display:flex;gap:10px;align-items:center;background:#f6d48f;color:#5b2d02;padding:9px 14px;font-weight:800;font-size:13px;letter-spacing:.02em;border-bottom:1px solid #e7b24f}
.offline-banner small{display:block;font-weight:600;letter-spacing:0;font-size:12px;color:#6b3a07}
.mbody{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 18px}
.mbody::-webkit-scrollbar,.dmain::-webkit-scrollbar{width:8px}.mbody::-webkit-scrollbar-thumb,.dmain::-webkit-scrollbar-thumb{background:var(--g300);border-radius:4px}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--g200);padding:6px 4px 10px}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--g500);padding:5px 0;position:relative}
.tabbar button.on{color:var(--blue-600)}
.tabbar .badge{position:absolute;top:0;right:calc(50% - 20px);background:var(--amber);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:16px}

/* ------- Componentes ------- */
.card{background:#fff;border:1px solid var(--g200);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card + .card,.card + .sec,.sec + .card{margin-top:12px}
.sec{margin-top:16px}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g500);margin:0 0 8px 2px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1,h2,h3,h4{margin:0;line-height:1.2}
.h1{font-size:22px;font-weight:800}
.h2{font-size:18px;font-weight:750}
.h3{font-size:15px;font-weight:700}
.muted{color:var(--g500)}
.small{font-size:13px}
.xs{font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid transparent;border-radius:11px;padding:11px 14px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--g100);color:var(--g900);transition:filter .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue-600);color:#fff}
.btn.primary:hover{background:var(--blue-700)}
.btn.secondary{background:#fff;border-color:var(--g300);color:var(--blue-700)}
.btn.secondary:hover{background:var(--blue-50)}
.btn.warn{background:#c26412;color:#fff}
.btn.ia{background:var(--indigo);color:#fff}
.btn.ok{background:var(--green);color:#fff}
.btn.ghost{background:transparent;color:var(--blue-700);padding:8px 6px}
.btn.big{width:100%;padding:15px 16px;font-size:16px;border-radius:13px}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--g500);font-weight:600}
.kv dd{margin:0;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--g300);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--g700);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.chip.static{cursor:default;padding:4px 10px;font-size:12px;border-width:1px}
.chip.ia{border-color:#c5cbf1;color:var(--indigo);background:var(--indigo-bg)}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:13px;font-weight:700;color:var(--g700);margin-bottom:6px}
.field>span em{font-style:normal;color:var(--red)}
.input,.select,.textarea{width:100%;border:1.5px solid var(--g300);border-radius:10px;background:#fff;padding:11px 12px;font-size:15px;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px var(--blue-100)}
.textarea{min-height:76px;resize:vertical}
.segc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.segc button{border:1.5px solid var(--g300);background:#fff;border-radius:10px;padding:10px 4px;font-weight:700;font-size:14px;color:var(--g700)}
.segc button.on{border-color:var(--blue-600);background:var(--blue-600);color:#fff}
.segc button.on.u-Alta{background:#c26412;border-color:#c26412}.segc button.on.u-Crítica{background:var(--red);border-color:var(--red)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photo{width:96px;height:72px;border-radius:9px;overflow:hidden;position:relative;border:1px solid var(--g200)}
.photo svg{width:100%;height:100%;display:block}
.photo .tag{position:absolute;left:4px;bottom:4px;background:rgba(16,36,63,.75);color:#fff;font-size:9.5px;font-weight:700;border-radius:4px;padding:1px 5px}
.photo-add{width:96px;height:72px;border-radius:9px;border:1.5px dashed var(--g400);background:var(--g50);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--g600)}
.notice{border-radius:11px;padding:11px 12px;display:flex;gap:10px;font-size:13.5px;align-items:flex-start}
.notice b{display:block;margin-bottom:2px}
.notice.amber{background:var(--amber-bg);color:#6b3a07;border:1px solid var(--amber-line)}
.notice.blue{background:var(--blue-50);color:var(--blue-800);border:1px solid var(--blue-200)}
.notice.green{background:var(--green-bg);color:#14583a;border:1px solid #a9dcc0}
.notice.red{background:var(--red-bg);color:#7d1f1f;border:1px solid #efb9b9}
.notice.ia{background:var(--indigo-bg);color:#2d3780;border:1px solid #c5cbf1}
.map{border-radius:11px;overflow:hidden;height:150px;border:1px solid var(--g200);background:#e6ecf2}
.map svg{width:100%;height:100%;display:block}
.prio{font-weight:800}
.prio.Media{color:#9a6a00}.prio.Alta{color:#c26412}.prio.Crítica{color:var(--red)}.prio.Baja{color:var(--g600)}
.divider{height:1px;background:var(--g200);margin:12px 0}

/* Línea de tiempo */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:44px 18px 1fr;gap:0 8px;position:relative;padding-bottom:12px}
.tl li::before{content:"";position:absolute;left:60px;top:18px;bottom:0;width:2px;background:var(--g200)}
.tl li:last-child::before{display:none}
.tl .tm{font-size:12px;font-weight:700;color:var(--g500);padding-top:2px;text-align:right}
.tl .dt{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--g400);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--g400)}
.tl .dt.campo{background:var(--blue-600);box-shadow:0 0 0 1.5px var(--blue-600)}
.tl .dt.central{background:var(--navy);box-shadow:0 0 0 1.5px var(--navy)}
.tl .dt.ia{background:var(--indigo);box-shadow:0 0 0 1.5px var(--indigo)}
.tl .dt.pend{background:#fff;box-shadow:0 0 0 2px var(--amber)}
.tl .tx{font-size:13.5px}
.tl .tx b{display:block;font-size:14px}
.tl .meta{display:flex;gap:6px;align-items:center;margin-top:3px;font-size:11.5px;font-weight:600;color:var(--g500);flex-wrap:wrap}

/* Inicio */
.hello{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--blue-100);color:var(--blue-700);display:grid;place-items:center;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:10px;box-shadow:var(--shadow)}
.stat .n{font-size:24px;font-weight:800;line-height:1}
.stat .l{font-size:11.5px;font-weight:600;color:var(--g500);margin-top:4px}
.stat.amber{background:var(--amber-bg);border-color:var(--amber-line)}.stat.amber .n{color:var(--amber)}
.order{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--g200);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.order.hl{border:2px solid var(--blue-500)}
.order .id{font-weight:800;font-size:13px;color:var(--blue-700)}
.order .tt{font-weight:750;font-size:16px;margin:2px 0 4px}
.order + .order{margin-top:10px}

/* Sync stepper */
.sync{background:#fff;border:1px solid var(--g200);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.steps{display:flex;align-items:center;gap:4px;margin-top:10px}
.steps .s{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--g400);text-align:center}
.steps .s i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--g100);color:var(--g400);font-style:normal}
.steps .s.done{color:var(--green)}.steps .s.done i{background:var(--green-bg);color:var(--green)}
.steps .s.cur{color:var(--blue-700)}.steps .s.cur i{background:var(--blue-600);color:#fff}
.steps .s.off i{background:var(--amber-bg);color:var(--amber)}.steps .s.off{color:var(--amber)}
.steps .ln{height:2px;flex:.4;background:var(--g200);margin-bottom:18px}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:6px;border-radius:3px;background:var(--g100);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--blue-600);border-radius:3px;transition:width .4s}

/* Chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:14px;padding:10px 12px;font-size:14px}
.msg.u{align-self:flex-end;background:var(--blue-600);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--g200);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.msg .who{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.msg.a .who{color:var(--indigo)}
.msg.u .who{color:#cfe0f6}
.aic{max-width:100%;align-self:stretch}
.aic h5{margin:12px 0 5px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--g600);display:flex;align-items:center;gap:6px}
.aic ul{margin:0;padding-left:18px}.aic li{margin:3px 0}
.aic .ok li::marker{color:var(--green)}
.ante{border:1px solid #c5cbf1;background:var(--indigo-bg);border-radius:10px;padding:9px 10px;margin-top:4px}
.ante button{margin-top:6px}
.src{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.limits{border-left:3px solid var(--red);background:var(--red-bg);border-radius:0 9px 9px 0;padding:8px 10px;color:#6f1d1d;font-size:13.5px;margin-top:4px}
.thinking{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--g600)}
.thinking .row i{width:16px;height:16px;border-radius:50%;border:2px solid var(--indigo);border-top-color:transparent;display:inline-block}
.suggest{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.suggest button{text-align:left;border:1px solid #c5cbf1;background:#fff;color:var(--indigo);border-radius:11px;padding:9px 11px;font-size:13.5px;font-weight:600}
.composer{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--g200)}
.composer textarea{flex:1;border:1.5px solid var(--g300);border-radius:12px;padding:9px 11px;font-size:14px;resize:none;height:44px;outline:none}
.composer button{width:46px;border-radius:12px;border:0;background:var(--indigo);color:#fff;display:grid;place-items:center}

/* Historial y criterios */
.searchbox{display:flex;align-items:center;gap:8px;border:1.5px solid var(--g300);background:#fff;border-radius:11px;padding:0 11px;color:var(--g500)}
.searchbox input{border:0;outline:none;padding:11px 0;flex:1;font-size:15px;background:transparent;min-width:0}
.case{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--g200);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.case + .case{margin-top:8px}
.case.new{border:2px solid var(--green);background:#fbfefc}
.case .id{font-weight:800;color:var(--blue-700);font-size:13px}
.case .tt{font-weight:700;font-size:14.5px;margin:2px 0 6px}
.crit{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.crit + .crit{margin-top:8px}
.crit .code{font-size:11.5px;font-weight:800;color:var(--blue-700);letter-spacing:.04em}
.crit .rule{margin-top:8px;padding-top:8px;border-top:1px solid var(--g200);font-size:13.5px}
.crit button.hd{all:unset;cursor:pointer;display:block;width:100%}
.crit.hl{border:2px solid var(--indigo)}

/* ------- App escritorio (Operaciones / Supervisión) ------- */
.dapp{display:grid;grid-template-columns:230px 1fr;grid-template-rows:minmax(0,1fr);height:100%;background:var(--g50)}
.side{background:var(--navy);color:#cbd8e8;display:flex;flex-direction:column;padding:16px 12px}
.side .logo{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:18px;letter-spacing:.05em;padding:2px 8px 16px}
.side .logo small{display:block;font-size:11px;font-weight:600;color:#8fa9c9;letter-spacing:.08em;text-transform:uppercase}
.side nav button{width:100%;border:0;background:transparent;color:#cbd8e8;display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:9px;font-weight:600;font-size:14px;text-align:left}
.side nav button.on{background:#20406b;color:#fff}
.side nav button:hover{background:#18345a}
.side nav .b{margin-left:auto;background:#e0802c;color:#fff;border-radius:9px;font-size:11px;padding:1px 7px;font-weight:800}
.side .foot{margin-top:auto;font-size:11.5px;color:#8fa9c9;border-top:1px solid #22406a;padding:12px 8px 0}
.dcol{display:flex;flex-direction:column;min-width:0;height:100%}
.dtop{display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--g200);padding:12px 20px}
.dtop .tt{font-size:18px;font-weight:800}
.dtop .sp{flex:1}
.crewsig{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;border:1px solid var(--g200);border-radius:10px;padding:6px 10px;background:var(--g50)}
.crewsig .d{width:8px;height:8px;border-radius:50%;background:var(--green)}
.crewsig.stale .d{background:var(--g400)}
.dmain{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 28px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.kpi .n{font-size:28px;font-weight:800;line-height:1}
.kpi .l{font-size:12.5px;color:var(--g500);font-weight:600;margin-top:6px}
.kpi.alert{border-color:#f0b47a;background:#fff8f0}.kpi.alert .n{color:#c26412}
.dgrid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-top:16px}
.dgrid.even{grid-template-columns:1fr 1fr}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--g500);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--g200)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--g150);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--blue-50)}
.tbl tr.hl td{background:#fff8f0}
.alertrow{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid #f0b47a;background:#fff8f0;border-radius:12px}
.alertrow + .alertrow{margin-top:8px}
.alertrow.read{border-color:var(--g200);background:#fff}
.alertrow .ico{width:36px;height:36px;border-radius:10px;background:#fbe2c7;color:#b45309;display:grid;place-items:center;flex:none}
.alertrow.read .ico{background:var(--g100);color:var(--g500)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--g200);border-radius:12px;overflow:hidden}
.compare>div{padding:12px 14px}
.compare>div:first-child{background:var(--g50);border-right:1px solid var(--g200)}
.compare>div:last-child{background:#fffaf3}
.compare .hd{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;display:flex;gap:6px;align-items:center}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--g200);border-radius:10px;background:#fff;font-size:14px;cursor:pointer}
.checklist label + label{margin-top:6px}
.checklist input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--blue-600);flex:none}
.checklist label.on{border-color:var(--blue-200);background:var(--blue-50)}
.dsec{margin-top:16px}
.empty{padding:22px;text-align:center;color:var(--g500);font-size:14px;border:1.5px dashed var(--g300);border-radius:12px;background:#fff}
.closure{text-align:center;padding:20px 12px}
.closure .bigic{width:64px;height:64px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;margin:0 auto 10px}
.ministeps{display:flex;flex-direction:column;gap:6px;text-align:left;margin-top:12px}
.ministeps div{display:flex;gap:8px;align-items:center;font-size:13.5px}
.ministeps b{width:46px;color:var(--g500);font-size:12px}

/* Guía de demostración */
.guide{position:fixed;top:52px;right:0;bottom:0;width:360px;background:#fff;border-left:1px solid var(--g200);box-shadow:-10px 0 30px rgba(16,36,63,.12);z-index:40;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s}
.guide.open{transform:none}
.guide .gh{padding:14px 16px;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between}
.guide .gb{flex:1;overflow-y:auto;padding:12px 16px 20px}
.gstep{border:1px solid var(--g200);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.gstep.done{background:#f5fbf8;border-color:#bfe3cf}
.gstep.cur{border:2px solid var(--blue-500)}
.gstep .n{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-700);display:flex;gap:6px;align-items:center}
.gstep.done .n{color:var(--green)}
.gstep p{margin:5px 0 8px;font-size:13.5px;color:var(--g700)}

/* Toasts y modales */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;border-radius:11px;padding:10px 14px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;gap:8px;align-items:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.modal-bg{position:fixed;inset:0;background:rgba(16,36,63,.45);z-index:90;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:86vh;overflow:auto}
.modal h3{font-size:18px;margin-bottom:8px}
.simtbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.simtbl td{padding:7px 6px;border-bottom:1px solid var(--g150);vertical-align:top}
.simtbl td:first-child{font-weight:700;width:42%}

/* Modo incrustado (para el video) */
body.embed .demobar,body.embed .guide,body.embed .pane-label{display:none!important}
body.embed .stage{padding:0;min-height:0;height:100vh;gap:0}
body.embed .col-m,body.embed .col-d{width:100%;max-width:none;height:100vh}
body.embed .phone{width:100%;height:100vh;min-height:0;border-radius:0;padding:0;box-shadow:none;background:transparent}
body.embed .phone .screen{border-radius:0}
body.embed .deskframe{height:100vh;min-height:0;border-radius:0;box-shadow:none}

}
.checklist .ck{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 10px;border:1px solid var(--g200);border-radius:10px;background:#fff;font-size:14px;font-weight:500}
.checklist .ck + .ck{margin-top:6px}
.checklist .ck .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--g400);display:grid;place-items:center;flex:none;color:#fff;margin-top:1px}

.checklist .ck.on .box{background:var(--blue-600);border-color:var(--blue-600)}
/* El tablero se adapta al ancho de su panel (vista dividida, pantallas medianas) */
.deskframe{container-type:inline-size}
.dgrid>*{min-width:0}
.dtop>div:first-child{min-width:0}
.dtop .xs{white-space:nowrap}
.tblwrap{overflow-x:auto}
@container (max-width:1060px){

/* Fricciones operativas (Clase 29): etiquetas de análisis sobre el prototipo */
.fric{margin:12px 0;border:1.5px dashed #10243f;border-radius:10px;background:#f5f7fa;padding:8px 10px}
.fric-tag{display:inline-flex;align-items:center;gap:5px;background:#10243f;color:#fff;font-size:11px;font-weight:800;letter-spacing:.09em;border-radius:6px;padding:3px 8px 3px 6px}
.fric-tag .ic{color:#f6c35a}

/* ================= v2 · interfaz simplificada: menos texto, más visual ================= */
.ichips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ichip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px 4px 7px;font-size:12px;font-weight:650;background:var(--g100);color:var(--g700);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ichip.warn{background:#fff1e3;color:#9a4a07}
.ichip.ok{background:var(--green-bg);color:var(--green)}
.ichip.red{background:var(--red-bg);color:var(--red)}
.ichip.ia{background:var(--indigo-bg);color:var(--indigo)}
.ichip.blue{background:var(--blue-100);color:var(--blue-700)}
.ichip.off{background:#fff;color:var(--g400);border:1px dashed var(--g300)}
/* medidor de prioridad / urgencia */
.pm{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;white-space:nowrap}
.pm .bars{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.pm .bars i{width:4px;border-radius:1.5px;background:var(--g200)}
.pm .bars i:nth-child(1){height:5px}.pm .bars i:nth-child(2){height:8px}.pm .bars i:nth-child(3){height:11px}.pm .bars i:nth-child(4){height:14px}
.pm.l1{color:var(--g600)}.pm.l1 .bars i:nth-child(-n+1){background:var(--g500)}
.pm.l2{color:#9a6a00}.pm.l2 .bars i:nth-child(-n+2){background:#d29a00}
.pm.l3{color:#c26412}.pm.l3 .bars i:nth-child(-n+3){background:#e07a1f}
.pm.l4{color:var(--red)}.pm.l4 .bars i{background:var(--red)}
/* ícono de tipo */
.tic{width:40px;height:40px;border-radius:12px;background:var(--blue-50);color:var(--blue-700);display:grid;place-items:center;flex:none}
.tic.sm{width:32px;height:32px;border-radius:9px}
.tic.warn{background:#fff1e3;color:#c26412}
.tic.gray{width:34px;height:34px;border-radius:10px;background:var(--g100);color:var(--g500)}
/* cabecera móvil */
.offline-banner{padding:8px 14px;font-size:13px}
.offline-banner small{font-size:11.5px}
.hello{margin-bottom:14px}
.stat .row{gap:6px;color:var(--blue-600)}
.stat.amber .row{color:var(--amber)}
.stat .l{margin-top:6px}
.notice.tap{width:100%;text-align:left;cursor:pointer;align-items:center;margin-bottom:12px}
.notice.tap>div{flex:1}
.notice.tap .row{margin-top:4px;gap:10px}
.order .tt{margin:0}
.order.mini{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-top:10px;box-shadow:none;cursor:default}
.order.mini b{font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--g200);background:#fff;border-radius:12px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--g700);box-shadow:var(--shadow);position:relative}
.tile>.ic{color:var(--blue-600)}
.tile b{font-size:11px;color:var(--g500);font-weight:700;display:flex}
.tile .off{position:absolute;top:6px;right:7px;color:var(--green)}
/* pasos visuales */
.hop{display:flex;align-items:flex-start;justify-content:center;margin-top:14px}
.hop .n{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--green);width:64px;text-align:center}
.hop .n i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green-bg);color:var(--green);font-style:normal}
.hop .n.cur{color:var(--blue-700)}.hop .n.cur i{background:var(--blue-600);color:#fff}
.hop .n.pend{color:var(--amber)}.hop .n.pend i{background:#fff;color:var(--amber);border:2px dashed var(--amber)}
.hop .n.todo{color:var(--g400)}.hop .n.todo i{background:var(--g100);color:var(--g400)}
.hop .l{height:2px;flex:1;max-width:46px;min-width:14px;background:var(--green);margin-top:16px}
.hop .l.pend,.hop .l.cur{background:repeating-linear-gradient(90deg,var(--amber) 0 6px,transparent 6px 11px)}
.hop .l.todo{background:var(--g200)}
.sync .hop{margin-top:12px}
/* datos rápidos */
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.fact{background:var(--g50);border-radius:10px;padding:8px 9px;display:flex;flex-direction:column;gap:5px;min-width:0}
.fact small{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--g500)}
.fact .v{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--g700)}
/* estado en una línea */
.statusrow{display:flex;align-items:center;gap:8px;border-radius:11px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.statusrow.blue{background:var(--blue-50);color:var(--blue-800);border:1px solid var(--blue-200)}
.statusrow.amber{background:var(--amber-bg);color:#6b3a07;border:1px solid var(--amber-line)}
.statusrow.green{background:var(--green-bg);color:#14583a;border:1px solid #a9dcc0}
.statusrow.gray{background:#fff;color:var(--g700);border:1px solid var(--g200)}
.statusrow.red{background:var(--red-bg);color:#7d1f1f;border:1px solid #efb9b9}
.statusrow .sp{flex:1}
.wait{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
/* listas con ícono */
.todo{list-style:none;margin:8px 0 0;padding:0}
.todo li{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13.5px;font-weight:600;border-bottom:1px solid var(--g150)}
.todo li:last-child{border-bottom:0}
.todo li>.ic{color:var(--blue-600)}
.todo li.done>.ic{color:var(--green)}
.todo.wait{margin-top:2px}.todo.wait li{color:var(--g500)}.todo.wait li>.ic{color:var(--g400)}
.upd{border:2px solid var(--blue-500)}
.quote{margin:10px 0 2px;padding:8px 10px;border-left:3px solid var(--blue-500);background:var(--blue-50);border-radius:0 9px 9px 0;font-size:13px;color:var(--blue-800)}
/* formulario */
.locrow{display:flex;align-items:center;gap:8px;border:1.5px solid var(--g300);border-radius:10px;background:#fff;padding:0 10px;color:var(--blue-600)}
.locrow .input{border:0;padding:11px 0;box-shadow:none!important;color:var(--g900);min-width:0}
.gps{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;color:var(--green);background:var(--green-bg);border-radius:6px;padding:2px 6px;flex:none}
.textarea.sm{min-height:50px}
.field>span i{font-style:normal;font-weight:600;color:var(--g400);font-size:12px}
.field>span .ic{display:inline-block;vertical-align:-2px}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:1.5px solid var(--g300);background:#fff;border-radius:12px;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--g700);text-align:center;line-height:1.15}
.opt>.ic{color:var(--g500)}
.opt.on{border-color:var(--blue-600);background:var(--blue-50);color:var(--blue-800);box-shadow:0 0 0 2px var(--blue-100)}
.opt.on>.ic{color:var(--blue-600)}
.opt.ok>.ic{color:var(--green)}.opt.amber>.ic{color:var(--amber)}.opt.red>.ic{color:var(--red)}
.opt.ok.on{border-color:var(--green);background:var(--green-bg);color:#14583a;box-shadow:0 0 0 2px #cdebd9}
.opt.amber.on{border-color:var(--amber);background:var(--amber-bg);color:#6b3a07;box-shadow:0 0 0 2px #f7e1b7}
.opt.red.on{border-color:var(--red);background:var(--red-bg);color:#7d1f1f;box-shadow:0 0 0 2px #f5cdcd}
.chip.ic>.ic{color:var(--g500)}
.chip.ic.on>.ic{color:#fff}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--g300);background:#fff;display:grid;place-items:center;color:var(--g700)}
.stepper .val{font-size:22px;font-weight:800;min-width:26px;text-align:center}
.homes{display:flex;flex-wrap:wrap;gap:2px;color:var(--amber);font-weight:800;align-items:center}
.urg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.urg button{border:1.5px solid var(--g300);background:#fff;border-radius:11px;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--g700)}
.urg button.on.u1{border-color:var(--g500);background:var(--g100);box-shadow:0 0 0 2px var(--g200)}
.urg button.on.u2{border-color:#d29a00;background:#fff8e1;box-shadow:0 0 0 2px #f6e7b4}
.urg button.on.u3{border-color:#e07a1f;background:#fff3e8;box-shadow:0 0 0 2px #fadcc0}
.urg button.on.u4{border-color:var(--red);background:var(--red-bg);box-shadow:0 0 0 2px #f5cdcd}
.cmpmini{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 11px;border-radius:11px;background:var(--g50);border:1px solid var(--g200);color:var(--g500)}
.cmpmini>div{display:flex;align-items:center;gap:6px;flex:1;color:var(--g700)}
.cmpmini small{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--g500)}
.photo .tag{font-size:10.5px}
.photo-add{gap:0;font-size:16px;color:var(--g500)}
.checklist .ck .cki{color:var(--blue-600);display:flex;margin-top:1px}
.checklist .ck{align-items:center}
/* registro guardado */
.hero{text-align:center;padding:20px 14px}
.bigic{width:64px;height:64px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;margin:0 auto 10px}
.bigic.amber{background:var(--amber-bg);color:var(--amber)}
.evalc{border-color:#efb9b9}
.lockline{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--red)}
